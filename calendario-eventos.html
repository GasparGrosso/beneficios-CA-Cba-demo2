<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario de Eventos · Colegio de Arquitectos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/marca-capc.css?v=20260921">

  <script src="assets/vendor/react.production.min.js"></script>
  <script src="assets/vendor/react-dom.production.min.js"></script>
  <script src="assets/vendor/babel.min.js"></script>
  <script src="store.js?v=20260921"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body { background:#F5F2F0; font-family:'Work Sans',sans-serif; -webkit-font-smoothing:antialiased; color:#161616; }
    input, button, textarea { font-family:inherit; }
    a { text-decoration:none; }
    ::-webkit-scrollbar { width:0; height:0; }
    @keyframes cardIn { from { opacity:0; transform:translateY(6px) scale(.97);} to { opacity:1; transform:none;} }
    .h-dark:hover { background:#2B2928 !important; }
    .day-ev { transition:transform .15s, box-shadow .15s; }
    .day-ev:hover { transform:scale(1.06); }
    .entrada:hover { background:#C8440B !important; }
    .nav-btn:hover { background:#F0ECEA !important; }

    /* Shell: móvil = una columna de 430px; desde 768px el contenido usa el ancho disponible (máx. 1240px). */
    .dash-screen { width:100%; max-width:430px; margin:0 auto; }
    .dash-inner { width:100%; }
    .dash-nav { max-width:430px; margin:0 auto; }
    .cal-layout { display:grid; grid-template-columns:1fr; gap:16px; }
    .cal-events { display:grid; grid-template-columns:1fr; gap:14px; }
    @media (min-width:768px) {
      .dash-screen { max-width:none; margin:0; }
      .dash-nav { max-width:none; margin:0; }
      .dash-inner { max-width:1240px; margin:0 auto; }
      .cal-events { grid-template-columns:repeat(auto-fill, minmax(255px, 1fr)); }
    }
    @media (min-width:1000px) {
      .cal-layout { grid-template-columns:minmax(0,1.25fr) minmax(320px,.9fr); align-items:start; }
      .cal-events { grid-template-columns:1fr; }
      .cal-side { position:sticky; top:96px; max-height:calc(100vh - 200px); overflow-y:auto; padding-right:2px; }
    }
    @media (min-width:1400px) {
      .cal-events { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/plain" id="app-source">
const { useState, useRef, useMemo, useEffect } = React;
const DISP = "'Work Sans',sans-serif";
const C = { bg:'#F5F2F0', surface:'#fff', pizarra:'#161616', terracota:'#E9500E', border:'#E2DBD7', borderCard:'#F0ECEA', t1:'#161616', t3:'#5b5652', t4:'#7A736E', t5:'#9E968F' };
const stroke = (extra={}) => ({ fill:'none', stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round', ...extra });
const ICal   = p => <svg width="10" height="10" viewBox="0 0 24 24" {...stroke({strokeWidth:2.5,...p})}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
const IQR    = p => <svg width="14" height="14" viewBox="0 0 24 24" {...stroke({strokeWidth:2.5,...p})}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>;
const IChevL = p => <svg width="18" height="18" viewBox="0 0 24 24" {...stroke({strokeWidth:2.5,...p})}><polyline points="15 18 9 12 15 6"/></svg>;
const IChevR = p => <svg width="18" height="18" viewBox="0 0 24 24" {...stroke({strokeWidth:2.5,...p})}><polyline points="9 18 15 12 9 6"/></svg>;

const goEvent = ev => { window.location.href = 'qr-entrada-evento.html?e=' + encodeURIComponent(ev.id); };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

/* ── Cabecera y navegación inferior compartidas por las pantallas del matriculado ── */
function AppHeader({ title, subtitle }) {
  return (
    <div style={{position:'sticky', top:0, zIndex:50, background:C.pizarra}}>
      <div style={{height:'3px', background:'var(--capc-degrade)'}}/>
      <div className="dash-inner" style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'12px 16px 12px'}}>
        <div style={{display:'flex', alignItems:'center', gap:'10px', minWidth:0}}>
          <a href="menu-beneficios.html" title="Volver al Menú Beneficios" style={{display:'block', flexShrink:0}}><img src="assets/marca/isotipo-color.png" alt="Colegio de Arquitectos de la Provincia de Córdoba" style={{height:'34px', width:'auto', display:'block', flexShrink:0}}/></a>
          <div style={{minWidth:0}}>
            <div style={{fontFamily:DISP, fontSize:'11.5px', fontWeight:800, color:'#fff', letterSpacing:'.08em', textTransform:'uppercase', lineHeight:1.2, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{title}</div>
            <div style={{fontSize:'9.5px', color:'#9E968F', letterSpacing:'.06em', textTransform:'uppercase', marginTop:'1px', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{subtitle}</div>
          </div>
        </div>
        <div style={{display:'flex', alignItems:'center', gap:'12px', flexShrink:0}}>
          <div style={{position:'relative', cursor:'pointer', padding:'4px'}}>
            <svg width="20" height="20" viewBox="0 0 24 24" {...stroke({stroke:'#7A736E'})}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <div style={{position:'absolute', top:'3px', right:'3px', width:'7px', height:'7px', background:C.terracota, borderRadius:'50%', border:'1.5px solid #161616'}}/>
          </div>
          <button onClick={()=>{window.location.href='index.html';}} className="h-dark" style={{display:'flex', alignItems:'center', gap:'6px', background:'rgba(255,255,255,.08)', border:'1px solid rgba(255,255,255,.18)', color:'#fff', borderRadius:'7px', padding:'7px 12px', fontFamily:DISP, fontSize:'11.5px', fontWeight:600, cursor:'pointer', transition:'all .2s', whiteSpace:'nowrap'}}>
            <svg width="15" height="15" viewBox="0 0 24 24" {...stroke({strokeWidth:2.2})}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Salir
          </button>
        </div>
      </div>
    </div>
  );
}
function BottomNav({ active }) {
  const items = [
    { key:'inicio', label:'Inicio', href:'menu-beneficios.html', icon:(c)=>(<svg width="17" height="17" viewBox="0 0 24 24" {...stroke({stroke:c, strokeWidth:2.3})}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>) },
    { key:'eventos', label:'Eventos', href:'calendario-eventos.html', icon:(c)=>(<svg width="18" height="18" viewBox="0 0 24 24" {...stroke({stroke:c})}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>) },
    { key:'mis', label:'Mis Beneficios', href:'mis-beneficios.html', icon:(c)=>(<svg width="18" height="18" viewBox="0 0 24 24" {...stroke({stroke:c})}><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>) },
    { key:'perfil', label:'Perfil', href:'#', icon:(c)=>(<svg width="18" height="18" viewBox="0 0 24 24" {...stroke({stroke:c})}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>) },
  ];
  return (
    <div className="dash-nav" style={{position:'fixed', bottom:0, left:0, right:0, width:'100%', background:'#fff', borderTop:'1px solid #E7E2E1', padding:'8px 16px 14px', zIndex:50, boxShadow:'0 -4px 16px rgba(22,22,22,.06)'}}>
      <div className="dash-inner" style={{display:'flex', justifyContent:'space-around', alignItems:'center'}}>
        {items.map(n => {
          const on = n.key === active;
          return (
            <a key={n.key} href={n.href} style={{display:'flex', flexDirection:'column', alignItems:'center', gap:'3px', cursor:'pointer', minWidth:'64px'}}>
              <div style={{width:'30px', height:'30px', background: on ? '#FEF0E8' : 'transparent', borderRadius:'7px', display:'flex', alignItems:'center', justifyContent:'center'}}>{n.icon(on ? C.terracota : C.t5)}</div>
              <span style={{fontSize:'9.5px', fontFamily:DISP, fontWeight: on ? 600 : 400, color: on ? C.terracota : C.t5}}>{n.label}</span>
            </a>
          );
        })}
      </div>
    </div>
  );
}

/* ── Tarjeta de evento: la misma que el carrusel de "Próximos Eventos" ── */
function EventCard({ ev, compact }) {
  return (
    <div onClick={()=>goEvent(ev)} className="capc-sel" style={{background:C.surface, borderRadius:'10px', overflow:'hidden', boxShadow:'0 4px 20px rgba(22,22,22,.08),0 1px 4px rgba(22,22,22,.05)', cursor:'pointer', border:`1px solid ${C.borderCard}`}}>
      <div style={{padding:'13px 14px 10px'}}>
        <span style={{display:'inline-block', background:ev.tagBg, color:'#fff', borderRadius:'3px', padding:'2px 8px', fontSize:'9.5px', fontFamily:DISP, fontWeight:600, letterSpacing:'.07em', textTransform:'uppercase'}}>{ev.tag}</span>
        <div style={{fontFamily:DISP, fontWeight:800, fontSize:'15px', color:C.t1, marginTop:'8px', lineHeight:1.25, letterSpacing:'-.01em'}}>{ev.title}</div>
        <div style={{fontSize:'11px', color:C.t5, marginTop:'3px'}}>{ev.subtitle}</div>
        <div style={{fontSize:'10.5px', color:C.t4, marginTop:'3px', display:'flex', alignItems:'center', gap:'4px'}}><ICal/> {ev.date}</div>
      </div>
      <div style={{position:'relative', height: compact ? '168px' : '210px', overflow:'hidden'}}>
        {ev.img ? (
          <div style={{width:'100%', height:'100%', backgroundImage:`url(${ev.img})`, backgroundSize:'cover', backgroundPosition:'center'}}/>
        ) : (
          <div style={{width:'100%', height:'100%', background:C.pizarra, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'0 16px'}}>
            <div style={{fontFamily:DISP, fontWeight:800, fontSize:'19px', color:'#fff', textAlign:'center', lineHeight:1.2}}>{ev.title}</div>
            <div style={{fontSize:'10.5px', color:'#9E968F', marginTop:'7px', textAlign:'center'}}>{ev.subtitle}</div>
          </div>
        )}
        <button className="entrada" onClick={e=>{e.stopPropagation(); goEvent(ev);}} style={{position:'absolute', bottom:'12px', left:'12px', display:'flex', alignItems:'center', gap:'7px', background:C.terracota, color:'#fff', border:'none', borderRadius:'7px', padding:'8px 15px', fontFamily:DISP, fontSize:'12.5px', fontWeight:600, cursor:'pointer', boxShadow:'0 2px 12px rgba(0,0,0,.22)', transition:'background .18s'}}>
          <IQR/> Obtener entrada
        </button>
      </div>
    </div>
  );
}

/* ── Carta flotante sobre el calendario ── */
function EventPopover({ events, index, onPick, onEnter, onLeave }) {
  const ev = events[index] || events[0];
  return (
    <div onMouseEnter={onEnter} onMouseLeave={onLeave} onClick={e=>e.stopPropagation()} style={{width:'250px', animation:'cardIn .22s ease'}}>
      {events.length > 1 && (
        <div style={{display:'flex', gap:'4px', marginBottom:'6px', justifyContent:'center'}}>
          {events.map((e, i) => (
            <button key={e.id} onClick={()=>onPick(i)} style={{border:'none', borderRadius:'9999px', padding:'3px 9px', fontFamily:DISP, fontSize:'9.5px', fontWeight:600, cursor:'pointer', background: i===index ? C.terracota : '#fff', color: i===index ? '#fff' : C.t3, boxShadow:'0 2px 8px rgba(22,22,22,.14)'}}>{i+1}</button>
          ))}
        </div>
      )}
      <div style={{boxShadow:'0 16px 44px rgba(22,22,22,.24)', borderRadius:'10px'}}>
        <EventCard ev={ev} compact/>
      </div>
    </div>
  );
}

function App() {
  const HOY = new Date();
  const [ym, setYm] = useState({ y: HOY.getFullYear(), m: HOY.getMonth() });
  const [active, setActive] = useState(null);   // { day, top, left, index }
  const gridRef = useRef(null);
  const hideTimer = useRef(null);

  const all = useMemo(() => CAC.allEvents(), []);
  const upcoming = useMemo(() => CAC.upcomingEvents(), []);

  /* día del mes → eventos (un evento de varios días marca cada uno de ellos) */
  const byDay = useMemo(() => {
    const map = {};
    all.forEach(ev => {
      const a = CAC.parseLocal(ev.inicio); if (!a) return;
      const b = CAC.parseLocal(ev.fin) || a;
      for (let d = new Date(a.getFullYear(), a.getMonth(), a.getDate()); d <= b; d.setDate(d.getDate() + 1)) {
        if (d.getFullYear() === ym.y && d.getMonth() === ym.m) (map[d.getDate()] = map[d.getDate()] || []).push(ev);
      }
    });
    return map;
  }, [all, ym]);

  const inMonth = useMemo(() => all.filter(ev => { const a = CAC.parseLocal(ev.inicio); return a && a.getFullYear() === ym.y && a.getMonth() === ym.m; }), [all, ym]);
  const sideList = inMonth.length ? inMonth : upcoming;
  const sideTitle = inMonth.length ? `Eventos de ${CAC.MESES_LARGO[ym.m].toLowerCase()}` : 'Próximos eventos';

  const DIAS = ['L','M','M','J','V','S','D'];
  const daysInMonth = new Date(ym.y, ym.m + 1, 0).getDate();
  const firstDow = (new Date(ym.y, ym.m, 1).getDay() + 6) % 7;   // lunes = 0
  const cells = [...Array(firstDow).fill(null), ...Array.from({ length: daysInMonth }, (_, i) => i + 1)];

  const move = dir => { setActive(null); setYm(p => { const d = new Date(p.y, p.m + dir, 1); return { y: d.getFullYear(), m: d.getMonth() }; }); };
  const cancelHide = () => { if (hideTimer.current) { clearTimeout(hideTimer.current); hideTimer.current = null; } };
  const scheduleHide = () => { cancelHide(); hideTimer.current = setTimeout(() => setActive(null), 160); };

  function show(day, e) {
    if (!byDay[day]) return;
    cancelHide();
    const cell = e.currentTarget.getBoundingClientRect();
    const host = gridRef.current.getBoundingClientRect();
    const CW = 250, top = cell.bottom - host.top + 8;
    let left = cell.left - host.left + cell.width / 2 - CW / 2;
    left = Math.max(4, Math.min(left, host.width - CW - 4));
    setActive({ day, top, left, index: 0 });
  }

  return (
    <div className="dash-screen" style={{background:C.bg, minHeight:'100vh', position:'relative', paddingBottom:'96px'}} onClick={()=>setActive(null)}>
      <AppHeader title="Calendario de Eventos" subtitle="Colegio de Arquitectos · Regional 5"/>

      <div className="dash-inner" style={{padding:'18px 16px 0'}}>
        {/* Navegación de mes */}
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'12px', gap:'10px'}}>
          <div>
            <div style={{fontFamily:DISP, fontSize:'19px', fontWeight:800, color:C.t1, letterSpacing:'-.02em', lineHeight:1.1}}>{CAC.MESES_LARGO[ym.m]} {ym.y}</div>
            <div style={{fontSize:'11.5px', color:C.t5, marginTop:'3px'}}>{inMonth.length} {inMonth.length === 1 ? 'evento' : 'eventos'} este mes · {upcoming.length} próximos</div>
          </div>
          <div style={{display:'flex', gap:'7px'}}>
            <button onClick={e=>{e.stopPropagation(); move(-1);}} className="nav-btn" title="Mes anterior" style={{width:'32px', height:'32px', borderRadius:'8px', border:`1px solid ${C.border}`, background:'#fff', color:C.t3, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer'}}><IChevL/></button>
            <button onClick={e=>{e.stopPropagation(); setActive(null); setYm({ y: HOY.getFullYear(), m: HOY.getMonth() });}} className="nav-btn" style={{height:'32px', padding:'0 12px', borderRadius:'8px', border:`1px solid ${C.border}`, background:'#fff', color:C.t3, fontFamily:DISP, fontSize:'11.5px', fontWeight:600, cursor:'pointer'}}>Hoy</button>
            <button onClick={e=>{e.stopPropagation(); move(1);}} className="nav-btn" title="Mes siguiente" style={{width:'32px', height:'32px', borderRadius:'8px', border:`1px solid ${C.border}`, background:'#fff', color:C.t3, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer'}}><IChevR/></button>
          </div>
        </div>

        <div className="cal-layout">
          {/* Columna calendario */}
          <div>
            <div ref={gridRef} style={{position:'relative', background:C.surface, borderRadius:'12px', border:`1px solid ${C.borderCard}`, boxShadow:'0 2px 10px rgba(22,22,22,.06)', padding:'14px'}}>
              <div style={{display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:'4px', marginBottom:'6px'}}>
                {DIAS.map((d, i) => <div key={i} style={{textAlign:'center', fontFamily:DISP, fontSize:'10px', fontWeight:600, color:C.t5, letterSpacing:'.06em', padding:'4px 0'}}>{d}</div>)}
              </div>
              <div style={{display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:'4px'}}>
                {cells.map((d, i) => {
                  if (!d) return <div key={i}/>;
                  const evs = byDay[d];
                  const isHoy = sameDay(new Date(ym.y, ym.m, d), HOY);
                  const on = active && active.day === d;
                  return (
                    <div key={i}
                      className={evs ? 'day-ev' : ''}
                      onMouseEnter={evs ? e => show(d, e) : undefined}
                      onMouseLeave={evs ? scheduleHide : undefined}
                      onClick={evs ? e => { e.stopPropagation(); on ? setActive(null) : show(d, e); } : undefined}
                      style={{aspectRatio:'1', maxHeight:'64px', borderRadius:'8px', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'3px', cursor: evs ? 'pointer' : 'default', position:'relative',
                        background: evs ? (on ? C.terracota : '#FEF0E8') : 'transparent',
                        border: isHoy ? `1.5px solid ${C.pizarra}` : (evs ? '1px solid #FBDDCB' : '1px solid transparent'),
                        boxShadow: on ? '0 4px 14px rgba(233,80,14,.4)' : 'none'}}>
                      <span style={{fontFamily:DISP, fontSize:'13px', fontWeight: evs || isHoy ? 800 : 400, color: on ? '#fff' : (evs ? C.terracota : C.t3), lineHeight:1}}>{d}</span>
                      {evs && (
                        <span style={{display:'flex', gap:'2px'}}>
                          {evs.slice(0, 3).map(ev => <span key={ev.id} style={{width:'4px', height:'4px', borderRadius:'50%', background: on ? '#fff' : ev.tagBg}}/>)}
                        </span>
                      )}
                    </div>
                  );
                })}
              </div>

              {/* Carta flotante */}
              {active && byDay[active.day] && (
                <div style={{position:'absolute', top:active.top, left:active.left, zIndex:60}}>
                  <EventPopover events={byDay[active.day]} index={active.index} onPick={i => setActive(a => ({ ...a, index: i }))} onEnter={cancelHide} onLeave={scheduleHide}/>
                </div>
              )}
            </div>

            {/* Referencias */}
            <div style={{marginTop:'14px', display:'flex', gap:'14px', flexWrap:'wrap', alignItems:'center', padding:'12px 14px', background:'#fff', borderRadius:'10px', border:`1px solid ${C.borderCard}`}}>
              <div style={{fontFamily:DISP, fontSize:'9.5px', fontWeight:600, color:C.t5, letterSpacing:'.1em', textTransform:'uppercase'}}>Referencias</div>
              {CAC.CATEGORIAS_EVENTO.map(c => (
                <div key={c.nombre} style={{display:'flex', alignItems:'center', gap:'6px'}}>
                  <span style={{width:'8px', height:'8px', borderRadius:'50%', background:c.color}}/>
                  <span style={{fontSize:'11.5px', color:C.t3}}>{c.nombre}</span>
                </div>
              ))}
              <div style={{display:'flex', alignItems:'center', gap:'6px'}}>
                <span style={{width:'10px', height:'10px', borderRadius:'3px', border:`1.5px solid ${C.pizarra}`}}/>
                <span style={{fontSize:'11.5px', color:C.t3}}>Hoy</span>
              </div>
            </div>
            <p style={{margin:'10px 4px 0', fontSize:'11.5px', color:C.t5, lineHeight:1.5}}>Pasá el mouse (o tocá) un día resaltado para ver la carta del evento. La inscripción y la entrada siguen en Autogestión: la app te lleva ahí.</p>
          </div>

          {/* Columna lista de eventos */}
          <div className="cal-side">
            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', margin:'22px 0 12px'}}>
              <h2 style={{fontFamily:DISP, fontWeight:800, fontSize:'16px', color:C.t1, margin:0, letterSpacing:'-.01em'}}>{sideTitle}</h2>
              <span style={{fontSize:'12px', color:C.t5}}>{sideList.length} {sideList.length === 1 ? 'evento' : 'eventos'}</span>
            </div>
            {sideList.length === 0 ? (
              <div style={{padding:'32px 20px', textAlign:'center', background:'#fff', borderRadius:'12px', border:`1px solid ${C.borderCard}`}}>
                <div style={{fontFamily:DISP, fontSize:'14px', fontWeight:600, color:C.t1}}>No hay eventos publicados</div>
                <div style={{fontSize:'12.5px', color:C.t5, marginTop:'4px'}}>Cuando el Colegio publique uno, aparece acá y en el calendario.</div>
              </div>
            ) : (
              <div className="cal-events">
                {sideList.map(ev => <EventCard key={ev.id} ev={ev}/>)}
              </div>
            )}
          </div>
        </div>
      </div>

      <BottomNav active="eventos"/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>

  <script>
    (function () {
      try {
        var src = document.getElementById('app-source').textContent;
        var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
        var s = document.createElement('script');
        s.textContent = out;
        document.body.appendChild(s);
      } catch (e) {
        document.getElementById('root').innerHTML =
          '<pre style="padding:24px;color:#8F3105;font:13px ui-monospace,monospace;white-space:pre-wrap">Error al compilar la app:\n' +
          (e && e.message ? e.message : e) + '</pre>';
        console.error(e);
      }
    })();
  </script>
</body>
</html>
